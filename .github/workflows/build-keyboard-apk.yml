name: Build Zeus AI Keyboard APK

on:
  push:
    paths:
      - 'android-keyboard/**'
      - '.github/workflows/build-keyboard-apk.yml'
  pull_request:
    paths:
      - 'android-keyboard/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        working-directory: android-keyboard
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: android-keyboard
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeusAIKeyboard-debug
          path: android-keyboard/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ZeusAIKeyboard-release
          path: android-keyboard/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
