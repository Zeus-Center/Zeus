name: Build Zeus AI Keyboard APK

on:
  push:
    paths:
      - 'android-keyboard/**'
  pull_request:
    paths:
      - 'android-keyboard/**'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create release with APK'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-keyboard

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeusAIKeyboard-debug
          path: android-keyboard/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeusAIKeyboard-release
          path: android-keyboard/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30

      - name: Create Release (optional)
        if: github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            android-keyboard/app/build/outputs/apk/debug/app-debug.apk
            android-keyboard/app/build/outputs/apk/release/app-release-unsigned.apk
          tag_name: keyboard-v1.0.0-${{ github.sha }}
          name: Zeus AI Keyboard v1.0.0
          body: |
            ## Zeus AI Keyboard v1.0.0
            
            ⚡ Bàn phím AI thông minh cho Android
            - Hỗ trợ gõ tiếng Việt (Telex)
            - Tích hợp AI (OpenRouter/OpenAI)
            - Theme tối hiện đại
            - Min Android 7.0 (API 24)
            
            ### Cài đặt
            1. Tải file APK (`app-debug.apk`)
            2. Cài đặt trên điện thoại
            3. Mở app → Bật bàn phím → Chọn làm bàn phím mặc định
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
